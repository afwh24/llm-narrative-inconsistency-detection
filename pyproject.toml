[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flawedfictions-fyp"
version = "0.1.0"
description = "Final Year Project scaffold for evaluating LLM plot inconsistency detection with FLAWEDFICTIONS."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "FYP Researcher" }
]
dependencies = [
  "nltk>=3.6",
  "pyarrow>=15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
